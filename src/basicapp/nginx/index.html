<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="card">
    <h1>Hello, World 👋</h1>
    <p>Your first beautiful HTML page.</p>

    <p class="counter">
      Page hits: <span id="hits">Loading...</span>
    </p>

    <a class="button" href="#">Get Started</a>
  </div>

<script>
const API_URL = "__API_URL__"; // this will be replaced at build time

async function loadHits() {
  try {
    const response = await fetch(`${API_URL}/hits`);
    const data = await response.json();
    document.getElementById("hits").textContent = data.hits;
  } catch (error) {
    document.getElementById("hits").textContent = "Error loading counter";
    console.error(error);
  }
}

loadHits();
</script>

</body>
</html>
