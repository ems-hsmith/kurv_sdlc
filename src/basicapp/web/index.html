<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="card">
    <h1>Hello, World 👋</h1>
    <p>Your HTML page is working perfectly.</p>
    <p id="hit-counter">Loading hits...</p>
    <a class="button" href="#">Get Started</a>
</div>
<script>
async function loadHits() {
    try {
        const response = await fetch("http://localhost:3000/hits");
        const data = await response.json();
        document.getElementById("hit-counter").textContent =
            "Page hits: " + data.hits;
    } catch (err) {
        document.getElementById("hit-counter").textContent =
            "Could not load hit counter";
        console.error(err);
    }
}
loadHits();
</script>
</body>
</html>
