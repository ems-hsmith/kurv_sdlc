AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD Pipeline for App Runner with ECR and CodeBuild.

Parameters:
  ProjectName:
    Type: String
    Description: Name for the project and resources convention of client-appname.
    AllowedPattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ConstraintDescription: Project name must be lowercase alphanumeric characters and can include single hyphens in the form of client-appname.
  GitHubRepo:
    Type: String
    Description: URL of the GitHub repository (e.g., https://github.com/user/repo.git).
    AllowedPattern: '^https?://github\.com/[\w.-]+/[\w.-]+(?:\.git)?$'
    ConstraintDescription: Must be a valid GitHub repository URL (e.g., https://github.com/username/repository).

Resources:
  # 1. Container Registry (ECR)
  ContainerRepositoryFrontend:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-frontend-repo"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  ContainerRepositoryBackend:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend-repo"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # 2. IAM Role for CodeBuild
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-CodeBuild-Role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-CodeBuildECRPushPolicy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRAuthToken # This action MUST be Resource: *
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                # This dynamically builds the ARN for your specific account and region
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # 3. CodeBuild Project
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true # Required to build Docker images
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ContainerRepositoryFrontend}"
          - Name: IMAGE_REPO_NAME
            Value: !Sub "${ProjectName}-frontend-repo"
          - Name: AWS_ACCOUNT_ID
            Value: !Sub "${AWS::AccountId}"
          - Name: REPOSITORY_URI_API
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ContainerRepositoryBackend}"
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepo
        BuildSpec: src/basicapp/buildspec.yml
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: ^refs/heads/main$
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # 4. App Runner IAM Access Role (Allows App Runner to pull from ECR)
  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-AppRunner-Role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # 5. App Runner Service
  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-AppRunner-Frontend-Service"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        AutoDeploymentsEnabled: true
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ContainerRepositoryFrontend}:latest"
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "80" # Change to your app's port

  # 5. App Runner Service
  AppRunnerBackendService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-AppRunner-Backend-Service"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        AutoDeploymentsEnabled: true
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ContainerRepositoryBackend}:latest"
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "3000" # Change to your app's port

Outputs:
  AppRunnerUrl:
    Value: !GetAtt AppRunnerService.ServiceUrl
  FrontendECRUri:
    Value: !GetAtt ContainerRepositoryFrontend.RepositoryUri