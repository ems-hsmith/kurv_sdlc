AWSTemplateFormatVersion: '2010-09-09'
Description: Deploys the App Runner services.

Parameters:
  ProjectName:
    Type: String
    Description: Name for the project and resources convention of client-appname.
  BackendECRUri:
    Type: String
    Description: The URI of the backend ECR repository.

Resources:

  # 4. App Runner IAM Access Role (Allows App Runner to pull from ECR)
  AppRunnerECRAccessRoleBackend:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-AppRunner-Role-Backend"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # 5. App Runner Service
  AppRunnerBackendService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-BackendSrvc"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRoleBackend.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref BackendECRUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "3000" # Change to your app's port

Outputs:
  BackendAppRunnerUrl:
    Value: !GetAtt AppRunnerBackendService.ServiceUrl
    Export:
      Name: !Sub "${ProjectName}-BackendUrl"
  BackendAppRunnerServiceArn:
    Value: !GetAtt AppRunnerBackendService.ServiceArn